[project]
name = "danish-tax-mcp"
version = "0.4.0"
description = "Danish personal tax figures and calculators, exposed as an MCP server"
readme = "README.md"
authors = [
    { name = "Mikael Bisgaard Dahlsen-Jensen", email = "47351659+mikaelbdj@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "denmark", "tax", "skat", "forskudsopgørelse", "trækprocent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: Danish",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "mcp>=2.3,<3",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
dk-tax = "dk_tax:main"
danish-tax-mcp = "dk_tax:main"  # so `uvx danish-tax-mcp` works

[project.urls]
Repository = "https://github.com/mikaelbdj/danish-tax-mcp"
Issues = "https://github.com/mikaelbdj/danish-tax-mcp/issues"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff==0.17.3",
]

[tool.uv.build-backend]
module-name = "dk_tax"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# An explicit list, so a ruff upgrade never changes the rules: pycodestyle errors, pyflakes,
# import order, bugbear, pyupgrade, and comprehensions ({} over dict()).
select = ["E", "F", "I", "B", "UP", "C4"]
