# Danish personal tax figures, income year 2026.
#
# One record per figure:
#   name      exact term as printed in the source
#   value     as printed in the source (percent as 12.01, amounts in whole kroner)
#   unit      percent | DKK
#   source    URL where the value can be checked
#   verified  date the value was last checked against the source
#   status    verified | secondary | unverified | proposed
#   note      optional
#
# Keys are the Danish terms in ASCII snake_case (æ→ae, ø→oe, å→aa).

