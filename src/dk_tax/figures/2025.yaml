# --- Pension ------------------------------------------------------------------

ratepension_max_indskud:
  name: Ratepension og ophørende alderspension (maksimumgrænse)
  value: 65500
  unit: DKK
  source: https://skat.dk/hjaelp/satser
  verified: 2026-11-04
  status: verified
  note: "PBL § 16, stk. 2: for each income year in total, per person, across all providers and schemes (rateforsikring, rateopsparing, ophørende livrente), employer and own contributions together. Each provider only sees its own accounts, so the saver keeps track. Not for §§ 15, 15 A, 15 B schemes."

aldersopsparing_max_indskud:
  name: Aldersopsparing - indtil 7 år før folkepensionsalderen
  value: 9400
  unit: DKK
  source: https://skat.dk/hjaelp/satser
  verified: 2026-11-04
  status: verified
  note: "PBL § 16, stk. 1: for each income year in total, per person, across all providers (aldersopsparing, aldersforsikring, supplerende engangssum). Payments an employer makes to such a scheme for the person reduce the amount; employer contributions to ratepension or livrente do not. Each provider only checks its own accounts (stk. 1, 3. pkt.), so the saver keeps track across banks and pension companies."

aldersopsparing_max_indskud_7aar:
  name: Aldersopsparing - fra og med det 7. år før folkepensionsalderen
  value: 61200
  unit: DKK
  source: https://skat.dk/hjaelp/satser
  verified: 2026-11-04
  status: verified
  note: "PBL § 16, stk. 1: for each income year in total, per person, across all providers (aldersopsparing, aldersforsikring, supplerende engangssum). Payments an employer makes to such a scheme for the person reduce the amount; employer contributions to ratepension or livrente do not. Each provider only checks its own accounts (stk. 1, 3. pkt.), so the saver keeps track across banks and pension companies."

pal_skat:
  name: Skat af det skattepligtige afkast (pensionsafkastskat)
