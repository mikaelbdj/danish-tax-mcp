name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 1 * *"  # monthly: catches a missing next-year figures file in Nov/Dec

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      # --locked: fail if uv.lock is out of date with pyproject.toml instead of re-locking.
      # ruff is pinned in the dev group, so CI and local runs use the same rules.
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
      - run: uv build
      # Tests run against src/; this checks the wheel users install (package data included).
      - name: Smoke-test the built wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python -I -c "
          import dk_tax, dk_tax.server
          from dk_tax.loader import load_year, load_kommuner
          assert 'site-packages' in dk_tax.__file__, dk_tax.__file__
          load_year(2026); load_kommuner(2026)
          print('wheel OK:', dk_tax.__file__)"
