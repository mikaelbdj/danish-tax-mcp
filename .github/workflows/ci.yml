name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 1 * *"  # monthly: catches a missing next-year figures file in Nov/Dec

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv run pytest
      - run: uv build
